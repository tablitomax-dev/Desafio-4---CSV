[project]
name = "desafio4-consulta-csv-linguagem-natural"
version = "0.1.0"
description = "MVP Desafio 4 I2A2: consultar dados de notas fiscais em CSVs via linguagem natural (Streamlit + DuckDB + Pydantic AI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "duckdb>=1.0",
    "pydantic-ai>=0.1",
    "pydantic>=2.8",
    "plotly>=5.24",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pytest-watch>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "e2e: fluxo fim-a-fim com LLM real (opcional)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
